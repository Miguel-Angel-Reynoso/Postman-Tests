name: Run Postman Tests

on: [push]   # Se ejecuta cada vez que subes cambios al repo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Postman CLI
        run: |
          curl -L https://dl-cli.pstmn.io/install/linux.sh | sh

      - name: Run Postman collection
        run: postman collection run 15854072-26217b20-8007-4512-8889-8d5680add8a0 --iteration-data booking1.csv --reporters cli,html --reporter-html-export results.html
