name: Run Postman Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Postman CLI (local)
        run: npm install postman-cli

      - name: Run Postman collection
        run: npx postman collection run TestCollection.postman_collection.json --iteration-data booking1.csv --reporters cli,html --reporter-html-export results.html

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: postman-report
          path: results.html
