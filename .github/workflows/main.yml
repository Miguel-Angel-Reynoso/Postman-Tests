name: Run Postman Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Run Postman collection
        run: postman collection run Test Collection N.postman_collection.json --iteration-data booking1.csv --reporters cli,html --reporter-html-export results.html
